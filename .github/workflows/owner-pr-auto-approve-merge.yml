name: Owner PR Auto-Approve and Merge

on:
  workflow_run:
    workflows: ["PR Validation"]
    types: [completed]

# Gitflow merge paths allowed for auto-approve:
#   feat/* | fix/* | hotfix/* | chore/* → dev
#   dev    → test
#   test   → stable
#   stable → main
#   chore/release-*  → main  (automated version-bump PRs from bot)

jobs:
  approve-and-merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-approve and merge eligible PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: >-
            ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR associated with this workflow run."
            exit 0
          fi

          BASE_REF=$(gh pr view "$PR_NUMBER" \
            --json baseRefName -q '.baseRefName')

          # Only act on gitflow-protected branches
          case "$BASE_REF" in
            dev|test|stable|main) ;;
            *)
              echo "PR #$PR_NUMBER targets '$BASE_REF' — skipping."
              exit 0
              ;;
          esac

          AUTHOR=$(gh pr view "$PR_NUMBER" \
            --json author -q '.author.login')
          HEAD_BRANCH=$(gh pr view "$PR_NUMBER" \
            --json headRefName -q '.headRefName')

          # ── Eligibility check ───────────────────────────────────────────
          # Allowed:
          #   1. Repo-owner PRs from the same repo (normal gitflow)
          #   2. github-actions[bot] PRs on chore/release-* branches
          #      (automated version-bump from release-publish workflow)

          IS_OWNER_PR=false
          IS_BOT_RELEASE=false

          if [ "$AUTHOR" = "$REPO_OWNER" ]; then
            HEAD_REPO=$(gh pr view "$PR_NUMBER" \
              --json headRepositoryOwner \
              -q '.headRepositoryOwner.login')
            if [ "$HEAD_REPO" = "$REPO_OWNER" ]; then
              IS_OWNER_PR=true
            else
              echo "PR #$PR_NUMBER from fork — skipping."
              exit 0
            fi
          fi

          if [ "$AUTHOR" = "github-actions[bot]" ]; then
            case "$HEAD_BRANCH" in
              chore/release-*)
                IS_BOT_RELEASE=true
                ;;
            esac
          fi

          if [ "$IS_OWNER_PR" = "false" ] && \
             [ "$IS_BOT_RELEASE" = "false" ]; then
            echo "PR #$PR_NUMBER: '$AUTHOR' / '$HEAD_BRANCH' not eligible."
            exit 0
          fi

          gh pr review "$PR_NUMBER" --approve \
            --body "Auto-approved after PR Validation passed."
          gh pr merge "$PR_NUMBER" \
            --squash --delete-branch --auto
